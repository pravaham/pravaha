name: Feature Request
description: Suggest a new feature or improvement
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered

  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      options:
        - '@pravaha/core'
        - '@pravaha/adapter-claude'
        - '@pravaha/adapter-openai'
        - '@pravaha/adapter-ollama'
        - '@pravaha/cli'
        - 'New package'
        - 'Other'

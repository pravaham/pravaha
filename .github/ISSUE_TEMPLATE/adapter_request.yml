name: Adapter Request
description: Request support for a new LLM provider or service
labels: ['adapter-request']
body:
  - type: input
    id: provider
    attributes:
      label: Provider / Service
      placeholder: 'Mistral AI'
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: API Documentation
      description: Link to the provider's API docs

  - type: textarea
    id: usecase
    attributes:
      label: Use Case
      description: Why do you need this adapter?
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to implement this adapter
